[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-cli"
version = "2.0.0"
description = "A local-first, permission-aware coding agent for the terminal (Ollama and OpenAI-compatible models)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
local-agent = "local_agent.cli.main:main"

[tool.setuptools.packages.find]
include = ["local_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
